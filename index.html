<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinosauri na brijunima</title>

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="slike/logo-ribica.svg">
</head>

<body>
<div class="mapa" id="mapContainer">

    <div class="map-viewport" id="mapViewport">
      <div class="map-content" id="mapContent">

        <img id="mapBase" class="map-layer active-map" src="slike/geoloska.png" alt="Karta nalazišta fosilnih tragova dinosaura na prostoru NP Brijuni" loading="eager">
        <img id="mapOrtho" class="map-layer" src="slike/ortofoto.png">

      </div>
    </div>

    <label class="map-toggle">
      <input type="checkbox" id="toggleMap">
      <span class="map-toggle-slider"></span>
      <span class="map-toggle-label">Geološka karta</span>
    </label>

    <div class="map-controls">
      <button id="toggle-points" class="map-btn map-btn-second">Sakrij točke</button>
      <button id="toggle-locate-mode" class="map-btn map-btn-third">Mod: Coord</button>
    </div>

    <div id="popup" class="popup hidden right">
      <div class="popup-header">
        <h3 id="title"></h3>
        <button id="popup-close" class="popup-close" aria-label="Zatvori">&times;</button>
      </div>

      <div class="popup-body">

        <div class="popup-scroll-text">
          <h4 id="subtitle"></h4>
          <div id="subcontent"></div>
        </div>

        <div class="popup-fixed-media">
          <div id="content"></div>
        </div>

      </div>
    </div>

    <div id="lightbox" class="lightbox hidden">
      <button id="lightboxClose" class="lightbox-close" aria-label="Zatvori">&times;</button>

      <button id="lightboxPrev" class="lightbox-nav lightbox-prev" aria-label="Prethodna slika">❮</button>
      <button id="lightboxNext" class="lightbox-nav lightbox-next" aria-label="Sljedeća slika">❯</button>

      <div class="lightbox-content">
        <div id="lightboxTitle" class="lightbox-title"></div>
        <img id="lightboxImg" class="lightbox-img" src="" alt="">
        <div id="lightboxCaption" class="lightbox-caption"></div>
        <div id="lightboxDots" class="lightbox-dots"></div>
      </div>
    </div>

  </div>
  
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
